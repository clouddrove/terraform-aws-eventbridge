description: |-
  Terraform module is used to create eventbridge resource on AWS for network connectivity..

# How to use this project
# yamllint disable rule:line-length
usage: |-
  ### event_bus_archive
  Here is an example of how you can use this module in your inventory structure:
    ```hcl
      module "eventbridge_archive" {

        create_bus      = true
        create_archives = true

        name        = "bus"
        environment = "test"
        label_order = ["name", "environment"]


        archives = {
        "launch-archive-existing-bus" = {
        description    = "launch-archive",
        retention_days = 1
        event_pattern = jsonencode(
        {
       "source" : ["aws.autoscaling"],
       "detail-type" : ["EC2 Instance Launch Successful"]
       }
        )
        }
        }

      }
    ```

  ### event_rule_target
  ```hcl
     module "eventbridge" {

        name        = "subnets"
        environment = "test"
        label_order = ["name", "environment"]

        rules = {
        orders = {
        description   = "Capture all order data"
        event_pattern = jsonencode({ "source" : ["myapp.orders"] })
        enabled       = true
        role_arn      = module.iam-role.arn
        }
        emails = {
        description   = "Capture all emails data"
        event_pattern = jsonencode({ "source" : ["myapp.emails"] })
        enabled       = true
        }
        }
        targets = {
        orders = [
        {
        name            = "send-orders-to-sqs-wth-dead-letter"
        arn             = aws_sqs_queue.queue.arn
        dead_letter_arn = aws_sqs_queue.dlq.arn
        },
        {
        name = "send-orders-to-sqs"
        arn  = aws_sqs_queue.queue.arn
        }
        ]
        emails = [
        {
        name            = "send-orders-to-kinesis"
        dead_letter_arn = aws_sqs_queue.dlq.arn
        arn             = aws_sqs_queue.dlq.arn

         }
          ]
        }
      }
  ```

  ### event_bus_logging_and_encryption
  Event buses can use a customer managed KMS key and send processing logs to a configured destination. The log destination policy and destination resource must be managed separately.
  ```hcl
  module "eventbridge" {
    source = "clouddrove/eventbridge/aws"

    name               = "orders"
    environment        = "prod"
    kms_key_identifier = aws_kms_key.eventbridge.arn
    bus_log_config = {
      level          = "INFO"
      include_detail = "FULL"
    }
  }
  ```

  ### eventbridge_global_endpoint
  Global endpoints provide regional failover for custom events. Create matching event buses in both Regions and a Route 53 health check, then pass their ARNs to the endpoint configuration.
  ```hcl
  module "eventbridge" {
    source = "clouddrove/eventbridge/aws"

    create_endpoints = true
    endpoints = {
      orders = {
        event_bus_arns           = [aws_cloudwatch_event_bus.primary.arn, aws_cloudwatch_event_bus.secondary.arn]
        primary_health_check_arn = aws_route53_health_check.primary.arn
        secondary_region         = "us-west-2"
        role_arn                 = aws_iam_role.replication.arn
        replication_state        = "ENABLED"
      }
    }
  }
  ```
